<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 颐鉴徽标（纯图形，与西苑医院院徽同一笔触语言：朱红毛笔圆环 + 阴阳留白） -->
  <defs>
    <linearGradient id="ink" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#B8280B"/>
      <stop offset="0.5" stop-color="#A21A00"/>
      <stop offset="1" stop-color="#8A1200"/>
    </linearGradient>
    <clipPath id="ringClip"><circle cx="100" cy="100" r="90"/></clipPath>
  </defs>

  <g clip-path="url(#ringClip)">
    <path d="M100 12 A88 88 0 1 0 181 56" fill="none" stroke="url(#ink)" stroke-width="16.5"
          stroke-linecap="round" transform="rotate(-6 100 100)"/>
    <path d="M181 56 C192 42 196 33 193 23" fill="none" stroke="url(#ink)" stroke-width="5.5"
          stroke-linecap="round" opacity="0.9"/>
    <path d="M105 25 A80 80 0 1 0 172 62" fill="none" stroke="#A21A00" stroke-width="3.4"
          stroke-linecap="round" opacity="0.25" transform="rotate(-6 100 100)"/>
  </g>

  <!-- 内白盘 -->
  <circle cx="100" cy="100" r="56" fill="#ffffff"/>

  <!-- 牙齿：宽冠双根，根间深凹；冠内白点呼应院徽阴阳水滴 -->
  <path d="M100 52
           C 78 52 66 66 66 86
           C 66 98 69 106 71 117
           C 73 130 75 150 83 150
           C 90 150 91 122 100 122
           C 109 122 110 150 117 150
           C 125 150 127 130 129 117
           C 131 106 134 98 134 86
           C 134 66 122 52 100 52 Z"
        fill="#A21A00"/>
  <circle cx="84" cy="78" r="8.5" fill="#ffffff"/>
  <circle cx="114" cy="92" r="4.6" fill="#ffffff" opacity="0.5"/>
</svg>
